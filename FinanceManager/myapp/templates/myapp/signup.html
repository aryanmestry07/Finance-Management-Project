{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            position: relative;
            /* Set the light background */
            background-color: #f8f9fa; 
            /* Center the card vertically */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.1); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        .card-title { 
            font-weight: 600; 
            color: #212529;
        }
        .form-label { 
            font-weight: 500; 
            color: #343a40;
        }
        /* Make the links match the theme */
        a {
            color: #20c997;
            text-decoration: none;
        }
        a:hover {
            color: #1a9c79;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <div class="text-center mb-4">
                <h1 class="h3 mb-0" style="font-weight: 600; color: #343a40;">
                    💰 Expense Tracker
                </h1>
            </div>

            <div class="card stat-card shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <h3 class="card-title text-center mb-4">Create an Account</h3>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger" role="alert" style="font-size: 0.9rem; padding: 0.75rem;">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST" action="{% url 'signup' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" name="confirm_password" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn" style="background-color: #20c997; color: white; border: none;">Sign Up</button>
                        </div>
                    </form>
                    <hr>
                    <div class="text-center">
                        <p class="mb-0">Already have an account? <a href="{% url 'login' %}">Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
