{% extends "myapp/index.html" %} {% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Edit Category</h5>
                    
                    {% if messages %}
                      {% for message in messages %}
                        <div class="alert alert-danger" role="alert">
                          {{ message }}
                        </div>
                      {% endfor %}
                    {% endif %}
                    
                    <form method="POST" action="{% url 'edit_category' category.id %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="category_name" class="form-label">Category Name</label>
                            <input type="text" class="form-control" name="category_name" id="category_name" value="{{ category.name }}" required>
                        </div>
                        <button type="submit" class="btn btn-success">Save Changes</button>
                        <a href="{% url 'manage_categories' %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
